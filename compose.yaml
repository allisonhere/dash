services:
  dash:
    # Published by .github/workflows/publish.yml on every push to master, so
    # Portainer can re-pull/update this like any other container. `build: .`
    # stays for local `docker compose up --build` without the registry.
    build: .
    image: ghcr.io/allisonhere/dash:latest
    container_name: dash
    restart: unless-stopped
    # Host networking lets the server-side NUT collector reach upsd on the
    # Docker host's loopback interface without exposing NUT to the container
    # bridge. Dash still listens on the same LAN port as before.
    network_mode: host
    environment:
      - PORT=3939
    volumes:
      # All data + theme selection live here — edits from any browser write back
      # to this dir, and it persists across restarts. Seed it with your JSON.
      - ./data:/config
      # Lets the homelab page read the host's containers (config a docker host
      # with "ssh": "local"). Read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
